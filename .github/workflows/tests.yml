name: Unit Tests

on:
  push:
    branches:
      - main
      - developer
  pull_request:

jobs:
  backend-unit-tests:
    name: Backend Unit Tests (Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend unit tests
        run: mvn -B test

  frontend-unit-tests:
    name: Frontend Unit Tests (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/departamentos-admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/departamentos-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless