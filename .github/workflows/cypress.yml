name: Cypress E2E Tests

on:
  push:
    branches:
      - main
      - developer
  pull_request:

jobs:
  cypress-e2e:
    name: Cypress E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/departamentos-admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/departamentos-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend/departamentos-admin
          start: npm start
          wait-on: http://localhost:4200
          wait-on-timeout: 120
